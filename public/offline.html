<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لا يوجد اتصال — ديكور AI</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #020617;
        color: #e2e8f0;
        font-family: "Cairo", "Tajawal", system-ui, sans-serif;
        padding: 24px;
        text-align: center;
      }
      .card { max-width: 380px; }
      .icon {
        width: 72px; height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: rgba(56, 189, 248, 0.12);
        display: flex; align-items: center; justify-content: center;
        font-size: 34px;
      }
      h1 { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
      p { font-size: 14px; line-height: 1.8; color: #94a3b8; margin-bottom: 24px; }
      button {
        background: #38bdf8;
        color: #020617;
        border: none;
        border-radius: 12px;
        padding: 12px 32px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon">📡</div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر تحميل الصفحة لأن الجهاز غير متصل بالشبكة. تحقق من الاتصال ثم أعد المحاولة.</p>
      <button onclick="window.location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
